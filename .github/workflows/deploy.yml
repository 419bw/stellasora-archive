name: Build, Sync and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 6 hours (UTC 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync even if upstream commits have not changed'
        required: false
        type: boolean
        default: false
      allow_single:
        description: 'Sync if either upstream repo updated (do not wait for both)'
        required: false
        type: boolean
        default: false
      changelog_note:
        description: 'Optional manual changelog reason (overrides the auto-derived summary)'
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Upstream Data Assets
        run: |
          mkdir -p data
          if [ ! -d "data/StellaSoraData" ]; then
            echo "Cloning StellaSoraData..."
            git clone --depth 1 https://github.com/AutumnVN/StellaSoraData.git data/StellaSoraData
          fi
          if [ ! -d "data/ss_lua" ]; then
            echo "Cloning ss_lua..."
            git clone --depth 1 https://github.com/MakoStar/ss-lua.git data/ss_lua
          fi

      - name: Process Sync
        id: sync_step
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SYNC_ARGS=""

            if [ "${{ github.event.inputs.force_sync }}" = "true" ]; then
              SYNC_ARGS="$SYNC_ARGS --force"
            fi

            if [ "${{ github.event.inputs.allow_single }}" = "true" ]; then
              SYNC_ARGS="$SYNC_ARGS --allow-single-upstream"
            fi

            echo "Running auto_sync.py $SYNC_ARGS..."
            export STELLA_SYNC_NOTE="${{ github.event.inputs.changelog_note }}"
            python scripts/automation/auto_sync.py $SYNC_ARGS
          else
            echo "Push event detected."
          fi

      - name: Changelog From Commits
        id: changelog_step
        if: github.event_name == 'push'
        env:
          COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: |
          echo "Collecting commits in $COMMIT_RANGE"
          python scripts/automation/changelog_from_commits.py --range "$COMMIT_RANGE"

      - name: Unit tests (push only)
        if: github.event_name == 'push'
        run: |
          python -m pytest tests/story/test_release_gate.py tests/automation/test_changelog.py -q

      - name: Validate story docs (push only)
        if: github.event_name == 'push'
        run: |
          python tests/story/validate_story.py

      - name: Build static site
        run: |
          python scripts/site/build_site.py

      - name: Validate static site
        run: |
          python tests/story/validate_site.py

      - name: Commit generated changelog
        if: github.event_name == 'push' && steps.changelog_step.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/
          if git diff --cached --quiet; then
            echo "Changelog already current; nothing to commit."
          else
            git commit -m "docs: 更新站点更新日志 [skip ci]"
            git push origin main
          fi

      - name: Commit and push changes if upstreams updated
        if: steps.sync_step.outputs.has_updates == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story_docs/ scripts/ README.md .upstream_sync_state.json
          COMMIT_MSG="${{ steps.sync_step.outputs.commit_msg }}"
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="chore: 自动同步上游剧情数据与更新日志"
          fi
          git commit -m "$COMMIT_MSG [skip ci]"
          git push origin main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=stellasora-archive --branch=main
